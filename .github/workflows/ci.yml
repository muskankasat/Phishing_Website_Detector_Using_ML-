name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .
      - name: Train (uses the committed raw CSV if UCI is unreachable)
        run: python train.py
      - run: pytest -q
